<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" width="1040" height="520" font-family="'Source Sans 3', 'Helvetica Neue', Arial, sans-serif">
  <title>Wanderlist live data flow: GBFS feed to Edge Function to Postgres to the page</title>
  <desc>A GBFS bikeshare feed is polled every 30 seconds by a Supabase Edge Function, which writes only the stations whose counts changed into Postgres and records every run; Supabase Realtime pushes those changes to the open page on Vercel.</desc>

  <rect width="1040" height="520" fill="#E8DCC5"/>

  <!-- heading -->
  <text x="40" y="52" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600" fill="#2B1D16" letter-spacing="-0.4">How a bike arriving at a dock reaches the page</text>
  <text x="40" y="78" font-size="15" fill="#685C54">Wanderlist · Assignment 5 · one hop per box, and nothing in the chain can be skipped</text>
  <line x1="40" y1="96" x2="1000" y2="96" stroke="#2B1D16" stroke-width="2"/>

  <!-- platform bands -->
  <text x="40" y="128" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.6">THEIRS</text>
  <text x="286" y="128" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.6">SUPABASE</text>
  <text x="824" y="128" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.6">VERCEL</text>
  <line x1="272" y1="140" x2="272" y2="430" stroke="#C3BAB0" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="810" y1="140" x2="810" y2="430" stroke="#C3BAB0" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- 1. source -->
  <rect x="40" y="150" width="200" height="112" fill="#2B1D16"/>
  <rect x="36" y="146" width="200" height="112" fill="#F6EFE3" stroke="#2B1D16" stroke-width="1"/>
  <text x="52" y="172" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.4">LIVE SOURCE</text>
  <text x="52" y="198" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="600" fill="#2B1D16">GBFS feed</text>
  <text x="52" y="220" font-size="13" fill="#685C54">station_status.json</text>
  <text x="52" y="240" font-size="13" fill="#685C54">no key · republishes ~60s</text>

  <!-- arrow 1 -->
  <line x1="248" y1="202" x2="320" y2="202" stroke="#2B1D16" stroke-width="1.5"/>
  <path d="M320 202 l-9 -5 v10 z" fill="#2B1D16"/>
  <text x="252" y="192" font-size="12" font-weight="600" fill="#AE3220">every 30s</text>

  <!-- 2. worker -->
  <rect x="336" y="150" width="212" height="112" fill="#2B1D16"/>
  <rect x="332" y="146" width="212" height="112" fill="#F6EFE3" stroke="#2B1D16" stroke-width="1"/>
  <text x="348" y="172" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.4">WORKER · DENO</text>
  <text x="348" y="198" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="600" fill="#2B1D16">poll-stations</text>
  <text x="348" y="220" font-size="13" fill="#685C54">Edge Function, run by Cron</text>
  <text x="348" y="240" font-size="13" fill="#685C54">service role · diffs the counts</text>

  <!-- arrow 2 -->
  <line x1="556" y1="202" x2="628" y2="202" stroke="#2B1D16" stroke-width="1.5"/>
  <path d="M628 202 l-9 -5 v10 z" fill="#2B1D16"/>
  <text x="544" y="192" font-size="12" font-weight="600" fill="#AE3220">only what changed</text>

  <!-- 3. database -->
  <rect x="644" y="150" width="156" height="112" fill="#2B1D16"/>
  <rect x="640" y="146" width="156" height="112" fill="#F6EFE3" stroke="#2B1D16" stroke-width="1"/>
  <text x="656" y="172" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.4">POSTGRES</text>
  <text x="656" y="198" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="600" fill="#2B1D16">stations</text>
  <text x="656" y="220" font-size="13" fill="#685C54">worker_runs</text>
  <text x="656" y="240" font-size="13" fill="#685C54">station_follows</text>

  <!-- arrow 3 -->
  <line x1="808" y1="202" x2="872" y2="202" stroke="#2B1D16" stroke-width="1.5"/>
  <path d="M872 202 l-9 -5 v10 z" fill="#2B1D16"/>
  <text x="806" y="192" font-size="12" font-weight="600" fill="#AE3220">Realtime</text>

  <!-- 4. page -->
  <rect x="888" y="150" width="116" height="112" fill="#2B1D16"/>
  <rect x="884" y="146" width="116" height="112" fill="#F6EFE3" stroke="#2B1D16" stroke-width="1"/>
  <text x="900" y="172" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.4">PAGE</text>
  <text x="900" y="198" font-family="Fraunces, Georgia, serif" font-size="19" font-weight="600" fill="#2B1D16">Next.js</text>
  <text x="900" y="220" font-size="13" fill="#685C54">no refresh</text>
  <text x="900" y="240" font-size="13" fill="#685C54">tint, then fade</text>

  <!-- what decides what gets polled: follows feed back into the worker -->
  <path d="M718 262 V 316 H 438 V 266" fill="none" stroke="#83796F" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M438 266 l-5 9 h10 z" fill="#83796F"/>
  <text x="470" y="334" font-size="13" fill="#685C54"><tspan font-weight="600" fill="#2B1D16">station_follows decides what is polled.</tspan> Nobody watching a city means no fetch at all.</text>

  <!-- freshness path -->
  <path d="M760 262 V 372 H 942 V 266" fill="none" stroke="#83796F" stroke-width="1.5" stroke-dasharray="5 4"/>
  <path d="M942 266 l-5 9 h10 z" fill="#83796F"/>
  <text x="470" y="390" font-size="13" fill="#685C54"><tspan font-weight="600" fill="#2B1D16">worker_runs is how the page tells stale from down.</tspan> stations.updated_at can only say the numbers are old, never why.</text>

  <!-- the four states -->
  <line x1="40" y1="430" x2="1000" y2="430" stroke="#C3BAB0" stroke-width="1"/>
  <text x="40" y="456" font-size="11" font-weight="600" fill="#685C54" letter-spacing="1.4">THE FOUR STATES THE PAGE DESIGNS</text>

  <rect x="40" y="470" width="14" height="14" fill="#F6EFE3" stroke="#83796F" stroke-width="1"/>
  <text x="62" y="482" font-size="13" fill="#2B1D16"><tspan font-weight="600">Loading</tspan> — no answer yet</text>

  <rect x="256" y="470" width="14" height="14" fill="#E4EAD9" stroke="#41662F" stroke-width="1"/>
  <text x="278" y="482" font-size="13" fill="#2B1D16"><tspan font-weight="600">Fresh</tspan> — a run succeeded within 2 intervals</text>

  <rect x="580" y="470" width="14" height="14" fill="#EDE3CE" stroke="#7A4F10" stroke-width="1"/>
  <text x="602" y="482" font-size="13" fill="#2B1D16"><tspan font-weight="600">Stale</tspan> — older than that, up to 10</text>

  <rect x="836" y="470" width="14" height="14" fill="#EFD9D9" stroke="#7B1E2B" stroke-width="1"/>
  <text x="858" y="482" font-size="13" fill="#2B1D16"><tspan font-weight="600">Down</tspan> — last run failed</text>
</svg>
